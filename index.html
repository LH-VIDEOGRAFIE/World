<style>
:root{--bg:#f4f1ea;--card:#fff;--tx:#1d2733;--mu:#6b7785;--ln:#e2ddd1;--ac:#e4572e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1720;--card:#18232f;--tx:#e8edf2;--mu:#8fa0b0;--ln:#2a3846}}
:root[data-theme="dark"]{--bg:#0f1720;--card:#18232f;--tx:#e8edf2;--mu:#8fa0b0;--ln:#2a3846}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;gap:10px;flex-wrap:wrap}
h1{font:700 22px Georgia,serif;margin:0}h1 span{color:var(--ac)}
.user{font-size:13px;color:var(--mu)}
main{max-width:1100px;margin:0 auto;padding:0 14px 40px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:14px}
#gw{position:relative;border-radius:16px;overflow:hidden;background:radial-gradient(circle at 50% 40%,#16314d,#07121c);border:1px solid var(--ln)}
canvas#g{display:block;width:100%;height:clamp(340px,62vw,560px);cursor:grab;touch-action:none}
.hint{position:absolute;left:12px;bottom:10px;color:#9fb4c8;font-size:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:760px){.row{grid-template-columns:1fr}}
h2{font:600 16px system-ui;margin:0 0 10px}
input[type=text]{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font:inherit}
.sug{max-height:190px;overflow:auto;margin-top:6px}
.sug button,.chip{display:flex;width:100%;justify-content:space-between;align-items:center;text-align:left;padding:9px 10px;border:0;background:none;color:var(--tx);font:inherit;border-bottom:1px solid var(--ln);cursor:pointer}
.sug button:hover{background:var(--bg)}.sug small{color:var(--mu)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}@media(max-width:600px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px}.kpi b{display:block;font:700 26px Georgia,serif;color:var(--ac)}.kpi span{font-size:12px;color:var(--mu)}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;color:var(--mu);font-weight:500;border-bottom:1px solid var(--ln);padding:6px}td{padding:6px;border-bottom:1px solid var(--ln);vertical-align:top}
.x{border:0;background:none;color:var(--mu);cursor:pointer;font-size:16px}
.col{display:flex;gap:14px;flex-wrap:wrap}.col label{font-size:13px;color:var(--mu);display:flex;flex-direction:column;gap:4px}.col input{width:56px;height:36px;border:1px solid var(--ln);border-radius:8px;background:none;padding:2px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 16px;font:600 14px system-ui;cursor:pointer;margin:0 8px 8px 0}.btn.s{background:var(--bg);color:var(--tx);border:1px solid var(--ln)}
svg text{fill:var(--tx);font:12px system-ui}
.user a{color:var(--ac)}#login{position:fixed;inset:0;background:rgba(7,18,28,.8);display:none;align-items:center;justify-content:center;z-index:9;padding:16px}#login .card{width:min(360px,100%);margin:0}#login input{margin-bottom:10px}</style></head><body>
<header><h1>Mein <span>Reise-Globus</span></h1><div class="user" id="user"></div></header>
<div id="login"><div class="card"><h2>🌍 Anmelden oder neu registrieren</h2><input type="text" id="ln" placeholder="Benutzername" autocomplete="username"><input type="password" id="lp" placeholder="PIN (optional)" autocomplete="current-password" style="width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font:inherit"><div class="user" id="lm" style="margin:8px 0;color:var(--ac)"></div><button class="btn" onclick="doLogin()">Los geht's</button><div class="user">Neuer Name = neues Konto. Daten werden pro Benutzer in diesem Browser gespeichert.</div></div></div>
<main>
<div id="gw"><canvas id="g"></canvas><div class="hint">Ziehen zum Drehen · Scrollen/Pinch zum Zoomen</div></div>
<div class="row" style="margin-top:14px">
 <div class="card"><h2>🌍 Land hinzufügen</h2><input type="text" id="qc" placeholder="Land suchen, z. B. Japan" autocomplete="off"><div class="sug" id="sc"></div></div>
 <div class="card"><h2>📍 Stadt hinzufügen</h2><input type="text" id="qs" placeholder="Stadt in deinen Ländern suchen" autocomplete="off"><div class="sug" id="ss"></div></div>
</div>
<div class="kpis" id="kpis"></div>
<div class="row">
 <div class="card"><h2>Besuchte Länder</h2><div id="tbl"></div></div>
 <div class="card"><h2>Kontinente</h2><div id="bars"></div><h2 style="margin-top:14px">Weltabdeckung</h2><div id="donut"></div></div>
</div>
<div class="card"><h2>🎨 Design</h2><div class="col" id="cols"></div></div>
<div class="card"><h2>⬇️ Export</h2><button class="btn" id="pdf">PDF herunterladen</button><button class="btn s" id="jpg">JPEG herunterladen</button><div class="user" id="msg"></div></div>
</main>

 S.countries.forEach(a=>{const f=byA[a]||{c:capOf(a)};if(f.c)pin(f.c[0],f.c[1],C.cflag,34)});
 S.cities.forEach(i=>{const t=CITIES[i];if(t)pin(t[3],t[2],C.tflag,20)});
 const sh=x.createRadialGradient(w/2-r*.4,h/2-r*.4,r*.2,w/2,h/2,r);sh.addColorStop(0,'rgba(255,255,255,.12)');sh.addColorStop(.7,'rgba(0,0,0,0)');sh.addColorStop(1,'rgba(0,0,0,.45)');
 x.beginPath();pa({type:'Sphere'});x.fillStyle=sh;x.fill()}
function capOf(a){const c=CITIES.find(t=>t[1]==a);return c?[c[3],c[2]]:null}
function frame(){try{const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;if(Math.abs(r.width*d-W)>2||Math.abs(r.height*d-H)>2||!W)size();if(auto&&!dragging)rot[0]+=.15;draw(ctx,W,H,R*k,rot)}catch(e){document.querySelector('.hint').textContent='Fehler: '+e.message}requestAnimationFrame(frame)}
let last=null;cv.addEventListener('pointerdown',e=>{dragging=true;auto=false;last=[e.clientX,e.clientY];cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing'});

 if(!S.countries.length){$('ss').innerHTML='<small style="color:var(--mu);padding:8px;display:block">Füge zuerst ein Land hinzu.</small>';return}
 CITIES.map((t,i)=>[t,i]).filter(([t])=>S.countries.includes(t[1])&&norm(t[0]).includes(q)).slice(0,8).forEach(([t,i])=>{const b=document.createElement('button');const has=S.cities.includes(i);

function stats(){const cs=S.countries,cont={};cs.forEach(a=>cont[CO[a][1]]=(cont[CO[a][1]]||0)+1);return{cs,cont}}
function renderAll(){const{cs,cont}=stats();const nc=Object.keys(cont).filter(c=>c!='AN').length;
 $('kpis').innerHTML=[[cs.length,'Länder'],[nc+' / 6','Kontinente'],[S.cities.length,'Städte'],[Math.round(cs.length/195*100)+' %','der Welt']].map(([a,b])=>`<div class="kpi"><b>${a}</b><span>${b}</span></div>`).join('');
 const rows=[...cs].sort((a,b)=>CO[a][0].localeCompare(CO[b][0],'de')).map(a=>{const ci=S.cities.filter(i=>CITIES[i][1]==a).map(i=>CITIES[i][0]);
  return`<tr><td>${flag(a)} <b>${CO[a][0]}</b><br><small style="color:var(--mu)">${ci.join(', ')||'–'}</small></td><td>${CN[CO[a][1]]}</td><td><button class="x" data-a="${a}">✕</button></td></tr>`}).join('');
 $('tbl').innerHTML=cs.length?`<table><tr><th>Land</th><th>Kontinent</th><th></th></tr>${rows}</table>`:'<small style="color:var(--mu)">Noch keine Länder – such oben dein erstes Reiseziel.</small>';
 $('tbl').querySelectorAll('.x').forEach(b=>b.onclick=()=>{const a=b.dataset.a;S.countries=S.countries.filter(x=>x!=a);S.cities=S.cities.filter(i=>CITIES[i][1]!=a);save();renderAll()});
 const tot={};A2.forEach(a=>tot[CO[a][1]]=(tot[CO[a][1]]||0)+1);

 const p=cs.length/A2.length,r=46,L=2*Math.PI*r;
 $('donut').innerHTML=`<svg viewBox="0 0 120 120" width="130"><circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--bg)" stroke-width="14"/><circle cx="60" cy="60" r="${r}" fill="none" stroke="${S.colors.visit}" stroke-width="14" stroke-dasharray="${L*p} ${L}" transform="rotate(-90 60 60)"/><text x="60" y="66" text-anchor="middle" style="font:700 20px Georgia">${Math.round(p*100)}%</text></svg>`;
 if(!$('cols').children.length)[['land','Land'],['sea','Ozean'],['visit','Besucht'],['cflag','Länder-Flagge'],['tflag','Städte-Flagge']].forEach(([k,l])=>{const lb=document.createElement('label');lb.textContent=l;const i=document.createElement('input');i.type='color';i.value=S.colors[k];i.dataset.k=k;i.oninput=()=>{S.colors[k]=i.value;save();renderAll()};lb.appendChild(i);$('cols').appendChild(lb)});
 $('cols').querySelectorAll('input').forEach(i=>{i.value=S.colors[i.dataset.k]||DEF[i.dataset.k]})}
// ---------- Export (Poster auf Canvas -> JPEG/PDF)

 const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#0b1a2a');g.addColorStop(1,'#13304d');x.fillStyle=g;x.fillRect(0,0,w,h);
 x.fillStyle='#fff';x.font='700 64px Georgia';x.fillText('Meine Reisen',70,110);x.fillStyle=C.visit;x.font='28px system-ui';x.fillText(`${cs.length} Länder · ${Object.keys(cont).length} Kontinente · ${S.cities.length} Städte`,70,160);
 const gc=document.createElement('canvas');gc.width=gc.height=900;draw(gc.getContext('2d'),900,900,420,[rot[0],rot[1],0]);x.drawImage(gc,170,200);
 let y=1150;x.font='700 30px system-ui';x.fillStyle='#fff';x.fillText('Kontinente',70,y);const ks=Object.keys(CN).filter(k=>k!='AN'),tot={};A2.forEach(a=>tot[CO[a][1]]=(tot[CO[a][1]]||0)+1);
 ks.forEach((k,i)=>{const yy=y+40+i*44,v=cont[k]||0;x.font='22px system-ui';x.fillStyle='#cfe0ee';x.fillText(CN[k],70,yy+20);x.fillStyle='rgba(255,255,255,.12)';x.fillRect(260,yy,320,22);x.fillStyle=C.visit;x.fillRect(260,yy,320*v/tot[k],22);x.fillStyle='#fff';x.fillText(v+'/'+tot[k],595,yy+20)});

 const names=[...cs].map(a=>CO[a][0]).sort((a,b)=>a.localeCompare(b,'de'));names.slice(0,36).forEach((n,i)=>x.fillText('• '+n,690+Math.floor(i/12)*180,y+40+(i%12)*30));

 x.fillStyle='#6f8aa3';x.font='18px system-ui';x.fillText('Erstellt mit Mein Reise-Globus',70,h-50);return c}
